<div class="w-full">
  <mat-radio-group [value]="cartService.selectedDelivery()?.id" class="grid grid-cols-2 gap-4">
    @for (method of checkoutService.deliveryMethods; track method.id) {
      <div
        (click)="updateDeliveryMethod(method)"
        class="p-3 border border-gray-200 cursor-pointer w-full h-full hover:bg-purple-100 rounded-lg transition-colors"
        [class.border-purple-600]="cartService.selectedDelivery()?.id === method.id"
        [class.bg-purple-50]="cartService.selectedDelivery()?.id === method.id">
        <mat-radio-button
          [checked]="cartService.selectedDelivery()?.id === method.id"
          (change)="updateDeliveryMethod(method)"
          class="w-full h-full"
          [value]="method.id">
          <div class="flex flex-col w-full h-full">
            <strong>{{method.shortName}} - {{method.price | currency:'EGP':'symbol':'1.2-2' }} </strong>
            <span class="text-sm text-gray-600">{{method.description}}</span>
          </div>
        </mat-radio-button>
      </div>
    }
  </mat-radio-group>
</div>
